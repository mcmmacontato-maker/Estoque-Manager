name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore (falha se houver pacote vulnerável)
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Testes
        run: dotnet test --no-build -c Release --logger "console;verbosity=normal"
      - name: Auditoria de pacotes
        run: |
          dotnet list package --vulnerable --include-transitive | tee audit.txt
          ! grep -q "tem os pacotes vulneráveis\|has the following vulnerable packages" audit.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Auditoria de pacotes
        run: npm audit --audit-level=moderate
      - run: npm run build
